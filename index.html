<script id="site-data" type="application/json">{"title": "灰と砂のレイルロード", "english": "ASH AND SAND RAILROAD", "intro": "主人公ルートと相棒ゼノン。行き先の分からない列車に乗り、独自の規則を持つ国々を巡る旅の物語。", "story": ["行き先の分からない列車に、二人の旅人が乗っている。", "ルートとゼノン。長く旅を共にする二人は、互いの過去も旅の目的も深く語らない。", "列車が停まるのは、常識の異なる奇妙な国々。そこには、その国だけの規則があり、そこで暮らす人々の人生がある。", "何に関わり、何を選び、何を残して去るのか。", "旅の行方は、主人公ルートの選択によって変わっていく。"], "characters": [{"id": "route", "name": "ルート", "english": "ROUTE", "description": ["くすんだ金髪と、暗色の機能的な旅装。ゼノンに比べて小綺麗で、落ち着いた外見の旅人。", "竹を割ったようにさっぱりしていて、大ざっぱ。男らしく現実的で、判断が早い。観察力があり、ゼノンの詭弁を受け流しては現実的な指摘をする。", "食べ物には目がなく、意外と食いしん坊。"], "role": "主人公 / PLAYER CHARACTER"}, {"id": "zenon", "name": "ゼノン", "english": "ZENON", "description": ["アッシュグレーの無造作な髪と無精髭。くたびれたグレーのロングコートをまとい、胡散臭い笑みを浮かべる男。", "極端な合理主義を装った快楽主義者。哲学や詭弁で、自分の怠惰やわがままを正当化する。", "知性と語彙力の大半を、自分が楽をするために使う。自己中心的な要求を哲学や詭弁で正当化し、重大な事件もどこか他人事。", "持ち物は、白紙の革表紙本と銀のスキットル。"], "role": "旅の相棒 / PARTNER"}], "worlds": [{"id": "happy_mist", "name": "幸福の霧の国", "description": "白い霧に包まれた国。人々は幸福そうに暮らしているが、その幸福には奇妙な仕組みが存在する。", "people": [{"id": "administrator", "name": "管理者", "description": "幸福の霧の国を管理する、謎めいた人物。国を包む霧と、人々の穏やかな暮らしを維持している。その言葉はどこまでも理性的で、国の仕組みに疑問を抱くルートたちにも淡々と応じる。この国にとっての「幸福」を、誰よりも確信しているかのようだ。"}, {"id": "mist_girl", "name": "謎の少女", "description": "幸福の霧に包まれた都で、ルートたちが出会う少女。穏やかな笑顔があふれる街の中で、彼女だけはどこか物憂げな眼差しをしている。多くを語ろうとしないその姿は、幸福に満ちたはずの国に、小さな違和感を残す。"}]}, {"id": "rust", "name": "錆の国", "description": "赤茶けた鉄と煤の国。立ち止まると身体が錆びてしまうため、人々は動き続けなければならない。", "people": [{"id": "dario", "name": "ダリオ・ゲメル", "description": "錆の国の歯車塔で第三班長を務める男。豪快で気さくな性格で、慣れない土地にやってきたルートたちにも分け隔てなく接する。絶えず動き続けなければならない過酷な環境の中、多くの作業員をまとめる頼もしい存在。しかし、その陽気な態度の裏には、この国で長く生きてきた者だけが知る現実もある。"}, {"id": "rust_carrier", "name": "エレッタ・バーンズ", "description": "錆の国の街と外縁部を行き来する運び屋の女性。物資や部品を運びながら、荒れた土地を渡り歩いている。砂埃を防ぐ装備と身軽な旅装が、その仕事の過酷さを物語る。ルートたちとは街の酒場で出会うことになる。歯車塔の内側とは異なる視点から、この国の日常を知る人物。"}]}, {"id": "mist", "name": "願いの井戸の国", "description": "願いを叶える井戸が存在し、願いを叶えた者には不可解な変化が現れる。"}, {"id": "lovers", "name": "恋人の国", "description": "恋人同士でなければ入国できない国。ルートとゼノンは恋人を装って入国するが、そこで暮らす人々にもそれぞれの事情がある。", "people": [{"id": "rico", "name": "リコ・ミルティア", "description": "恋人の国で花屋として働く女性。花々に囲まれた街で暮らし、訪れる人々を穏やかに迎える。この国では、恋人同士であることが何よりも重んじられている。そんな場所で生きる彼女にも、大切にしている関係と、その人なりの事情がある。ルートたちは彼女との出会いを通じて、この国の日常に触れていく。"}, {"id": "gil", "name": "ジル・クロフォード", "description": "恋人の国で暮らす、リコの恋人。華やかな街並みと、恋人たちを祝福する文化の中で日々を送っている。恋人同士でなければ入国できないこの国では、二人の関係もまた、社会の決まりと無関係ではいられない。ルートたちとの出会いは、彼らの日常に思いがけない変化をもたらすかもしれない。"}]}, {"id": "desert", "name": "制約の国", "description": "日常生活が多数の禁止事項によって縛られている。"}, {"id": "evergreen", "name": "エバーグリーン", "description": "森と湖に囲まれた、自然豊かな国。", "people": [{"id": "liese", "name": "リーゼ・メルクロワ", "description": "自然豊かなエバーグリーンで、ルートたちが出会う女性の旅人。明るく快活で、物事を必要以上に深刻に捉えない、からっとした性格。かつて恋人と旅を共にしていたが、その相手を旅の途中で亡くしている。それでも旅人としての現実を、ごく当たり前のことのように語る彼女。その姿は、幾度も危険をくぐり抜けてきたルートとゼノンに、ある問いを残すことになる。"}]}], "system": {"heading": "その選択が、旅の行方を変える。", "description": "選ぶのは、主人公ルート。ひとつの正解に収まらない旅が、あなたを待っている。", "features": [{"id": "system", "title": "選択によって変わる物語", "text": "何に関わり、何を選ぶのか。ルートの行動が各国の物語を変え、異なる結末へと導く。どの道を歩むかは、あなた次第。"}, {"id": "chart", "title": "旅の分かれ道を、もう一度", "text": "ストーリーチャートから章や場面を選び、旅の分かれ道へ。あの時とは違う選択をして、もうひとつの物語をたどろう。"}, {"id": "partner", "title": "相棒にも、相棒の意思がある", "text": "ゼノンは、ただ指示を待つ仲間ではない。ルートとの関係やその場の状況を見て、自ら判断し行動する。親しくなれば、すべてが思いどおりに進むとは限らない。相棒の意思もまた、旅の行方を変えていく。"}, {"id": "resolution", "title": "問題を解く手段は、ひとつとは限らない", "text": "会話に耳を傾け、交渉し、機転を利かせる。戦うことだけが問題を解く手段ではない。目の前の状況を見極め、別の道を探してみよう。"}]}, "special": {"label": "初回生産版特典", "name": "特製透過しおり", "description": "旅の記憶を、光に透かして。\n\nゲームに登場する6つの国の風景を、ステンドグラス風の意匠に閉じ込めた特製しおり。光を通すことで色彩が美しく浮かび上がる、透明素材の初回生産版特典です。", "note": "非売品"}, "product": [["タイトル", "灰と砂のレイルロード"], ["英語表記", "ASH AND SAND RAILROAD"], ["発売日", "2013年11月21日（木）"], ["対応機種", "PlayStation Vita"], ["ジャンル", "選択分岐型RPG"], ["メーカー", "CLOCKBIRD（クロックバード）"], ["通常版希望小売価格", "6,090円（税込）"], ["予約特典", "オリジナルミニサウンドトラック"], ["初回生産版特典", "特製透過しおり（非売品）"]], "news": [{"date": "2013.11.21", "text": "『灰と砂のレイルロード』本日発売。", "target": "product"}, {"date": "2013.11.07", "text": "プロモーションムービーを公開しました。", "target": "movie"}, {"date": "2013.10.17", "text": "初回生産版特典「特製透過しおり」を公開しました。", "target": "special"}, {"date": "2013.09.26", "text": "SYSTEMページを更新しました。", "target": "system"}, {"date": "2013.08.29", "text": "WORLDページを公開しました。", "target": "world"}, {"date": "2013.07.18", "text": "公式サイトをオープンしました。", "target": "top"}], "images": {"hero": "assets/hero.png", "zenon": "assets/zenon.jpeg", "route": "assets/route.jpeg", "mist": "assets/mist.jpeg", "desert": "assets/desert.jpeg", "lovers": "assets/lovers.jpeg", "system": "assets/system.jpeg", "bookmark": "assets/bookmark.png", "chart": "assets/chart.jpeg", "partner": "assets/partner.jpeg", "resolution": "assets/resolution.jpeg", "happy_mist": "assets/happy_mist.jpeg", "administrator": "assets/administrator.png", "rust": "assets/rust.jpeg", "dario": "assets/dario.jpeg", "rico": "assets/rico.png", "gil": "assets/gil.png", "evergreen": "assets/evergreen.jpeg", "liese": "assets/liese.jpeg", "portraitKV": "assets/portraitKV.png", "titleLogo": "assets/titleLogo.png", "companyLogo": "assets/companyLogo.png", "bonusAd": "assets/bonusAd.png", "mist_girl": "assets/mist_girl.jpeg", "rust_carrier": "assets/rust_carrier.jpeg", "system_intro": "assets/system_intro.jpeg"}, "worldArchive": [{"id": "mist", "name": "願いの井戸の国", "description": "願いを叶える井戸が存在し、願いを叶えた者には不可解な変化が現れる。"}, {"id": "desert", "name": "制約の国", "description": "日常生活が多数の禁止事項によって縛られている。"}, {"id": "lovers", "name": "恋人の国", "description": "恋人同士でなければ入国できない国。ゼノンとルートは入国のため、恋人のふりをすることに。"}], "productArchive": [["タイトル", "灰と砂のレイルロード"], ["ジャンル", "ADV要素の強い、選択分岐型RPG（検討中）"], ["対応機種", "未定"], ["発売日", "未定"], ["価格", "未定"], ["メーカー", "未定"], ["初回購入特典", "透過しおり（非売品）"]], "showNews": true, "catchcopy": "次の国では、何が「当たり前」だろう。", "releaseStatus": "好評発売中", "movie": {"youtubeId": "kckGBhmdwTo", "title": "『灰と砂のレイルロード』プロモーションムービー"}}</script>
<script>

const bonusBanner=()=>`<a class="bonus-ad-banner" href="#special" aria-label="予約特典・初回生産版特典の詳細を見る">${safeImage(data.images.bonusAd)?`<img src="${esc(safeImage(data.images.bonusAd))}" alt="予約特典＆初回生産版特典：オリジナルミニサウンドトラック・特製透過しおり">`:'<span>予約特典＆初回生産版特典</span>'}<span class="bonus-ad-caption">特典のご案内 <b>詳細はこちら ›</b></span></a>`;
const moviePanel=()=>`<a class="movie-banner" href="#movie"><span class="movie-play" aria-hidden="true">▶</span><span><strong>PROMOTION MOVIE</strong><small>『灰と砂のレイルロード』公式PV</small></span><b>PV公開中 ›</b></a>`;
const youtubeId=()=>/^[A-Za-z0-9_-]{11}$/.test(data.movie?.youtubeId||'')?data.movie.youtubeId:'';
function render(){document.title=data.title+'｜公式サイト';document.querySelector('.mini-logo').innerHTML=safeImage(data.images.titleLogo)?`<img class="official-logo" src="${esc(safeImage(data.images.titleLogo))}" alt="${esc(data.title)}">`:esc(data.title)+`<small>${esc(data.english.toUpperCase())}</small>`;document.querySelector('nav').innerHTML=pages.map(p=>`<a href="#${p[0]}" data-page="${p[0]}">${p[1]}<small>${p[2]}</small></a>`).join('');
document.querySelector('main').innerHTML=`
<section class="page" id="top"><div class="top-film"><video autoplay muted loop playsinline preload="metadata" poster="assets/hero-poster.jpg" aria-hidden="true"><source src="assets/hero.mp4" type="video/mp4"></video><div class="top-film-brand"><h1><img src="${esc(safeImage(data.images.titleLogo))}" alt="${esc(data.title)}"></h1><p>次の国では、何が『当たり前』だろう。</p></div></div>${releaseInfo()}<div class="home-bottom"><section ${data.showNews?'':'hidden'}><h2 class="section-label">NEWS <small>更新情報</small></h2><ul class="news">${data.news.map(n=>`<li><time>${esc(n.date)}</time>${pages.some(p=>p[0]===n.target)?`<a href="#${n.target}">${esc(n.text)}</a>`:`<span>${esc(n.text)}</span>`}</li>`).join('')}</ul></section><aside>${bonusBanner()}</aside></div>${moviePanel()}<section class="introduction" aria-labelledby="intro-heading"><h2 id="intro-heading" class="section-label">INTRODUCTION <small>作品紹介</small></h2><div class="intro-columns"><div class="intro-visual">${safeImage(data.images.portraitKV)?`<img src="${esc(safeImage(data.images.portraitKV))}" alt="灰と砂のレイルロード 縦長キービジュアル">`:slot('portraitKV','KEY VISUAL')}</div><div class="intro-text"><p>${esc(data.intro)}</p><p>${esc(data.story[2]||'')}</p><div class="intro-links">${pages.filter(p=>p[0]!=='top').map(p=>`<a href="#${p[0]}"><strong>${p[1]}</strong><span>${p[2]}</span> ›</a>`).join('')}</div></div></div></section></section>

<section class="page" id="movie"><div class="page-inner">${heading('movie')}<h2 class="movie-title">${esc(data.movie.title)}</h2>${youtubeId()?`<div class="youtube-frame"><iframe title="${esc(data.movie.title)}" data-video-src="https://www.youtube-nocookie.com/embed/${youtubeId()}" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><p class="movie-links"><a class="spec-link" href="https://www.youtube.com/watch?v=${youtubeId()}" target="_blank" rel="noopener noreferrer">YouTubeで視聴する ↗</a></p>`:''}</div></section>

<section class="page" id="product"><div class="page-inner">${heading('product')}<div class="product-lead"><div><span class="eyebrow">${esc(data.english)}</span><h2>${esc(data.title)}</h2><p>${esc(data.catchcopy)}</p><strong class="product-sale">${esc(data.releaseStatus)}</strong></div>${safeImage(data.images.companyLogo)?`<img class="company-logo" src="${esc(safeImage(data.images.companyLogo))}" alt="CLOCKBIRD">`:''}</div><table class="spec"><tbody>${data.product.map(r=>`<tr><th scope="row">${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table><div class="product-bonus-link"><a class="spec-link" href="#special">特典広告・特製透過しおりを見る ›</a></div></div></section>`;
showCharacter(0);showWorld(0);route();document.querySelectorAll('.bonus-enlarge').forEach(a=>a.onclick=e=>{e.preventDefault();const box=document.querySelector('#bonus-viewer');box.querySelector('img').src=safeImage(data.images.bonusAd);box.showModal()});document.querySelectorAll('[data-character]').forEach(b=>b.onclick=()=>showCharacter(+b.dataset.character));document.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>showWorld(+b.dataset.world));document.querySelectorAll('[role=tablist]').forEach(list=>list.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const buttons=[...list.querySelectorAll('button')];let i=buttons.indexOf(document.activeElement);i=e.key==='Home'?0:e.key==='End'?buttons.length-1:(i+(e.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;buttons[i].click();buttons[i].focus()});document.querySelectorAll('.image-slot img').forEach(img=>{img.onload=()=>{for(const el of img.parentNode.querySelectorAll('span,small'))el.hidden=true};if(img.complete&&img.naturalWidth)img.onload()});}
function showCharacter(i){let c=data.characters[i];if(!c)return;document.querySelector('#character-panel').setAttribute('aria-labelledby','char-tab-'+i);document.querySelector('#character-panel').innerHTML=`<div class="character">${slot(c.id,c.english||c.name)}<div><p class="eyebrow">${esc(c.role||'')}</p><span class="name-en">${esc(c.english)}</span><h2>${esc(c.name)}</h2>${c.description.map(p=>`<p>${esc(p)}</p>`).join('')}</div></div>`;document.querySelectorAll('[data-character]').forEach(b=>{b.setAttribute('aria-selected',+b.dataset.character===i);b.tabIndex=+b.dataset.character===i?0:-1});fixImages();}
function showWorld(i){let w=data.worlds[i];if(!w)return;document.querySelector('#world-panel').setAttribute('aria-labelledby','world-tab-'+i);document.querySelector('#world-panel').innerHTML=`<div class="world">${slot(w.id,'WORLD IMAGE')}<h2>${esc(w.name)}</h2><p>${esc(w.description)}</p>${(w.people||[]).map(c=>`<article class="world-person">${slot(c.id,c.name)}<div><h3>${esc(c.name)}</h3><p>${esc(c.description)}</p></div></article>`).join('')}</div>`;document.querySelectorAll('[data-world]').forEach(b=>{b.setAttribute('aria-selected',+b.dataset.world===i);b.tabIndex=+b.dataset.world===i?0:-1});fixImages();}
function fixImages(){document.querySelectorAll('.image-slot img').forEach(img=>{img.onload=()=>img.parentNode.querySelectorAll('span,small').forEach(x=>x.hidden=true);if(img.complete&&img.naturalWidth)img.onload()})}
function route(){const id=pages.some(p=>p[0]===location.hash.slice(1))?location.hash.slice(1):'top';document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));const video=document.querySelector('#movie iframe');if(video){if(id==='movie'){if(!video.getAttribute('src'))video.src=video.dataset.videoSrc}else video.removeAttribute('src')}document.querySelectorAll('nav a').forEach(a=>{a.classList.toggle('active',a.dataset.page===id);if(a.dataset.page===id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});}
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});render();
const editor=document.querySelector('#editor'),area=document.querySelector('#data-editor'),status=document.querySelector('#edit-status');let editImages={};
function fillAssets(){const options=[['titleLogo','メインタイトルロゴ'],['companyLogo','CLOCKBIRD ロゴ'],['hero','TOP 横長キービジュアル'],['portraitKV','INTRODUCTION 縦長キービジュアル'],...data.characters.map(c=>[c.id,c.name]),...data.worlds.map(w=>[w.id,w.name]),...data.worlds.flatMap(w=>(w.people||[]).map(c=>[c.id,c.name])),['system_intro','SYSTEM 探索画面'],...(data.system.features||[]).map(f=>[f.id,f.title]),['bonusAd','予約特典＆初回生産版特典 広告'],['bookmark','透過しおり（単体）']];document.querySelector('#asset-select').innerHTML=options.map(([id,label])=>`<option value="${esc(id)}">${esc(label)}</option>`).join('')}
document.querySelector('#edit-open').onclick=()=>{editImages={...data.images};const copy={...data};delete copy.images;area.value=JSON.stringify(copy,null,2);fillAssets();status.textContent='';editor.showModal()};document.querySelector('#close-editor').onclick=()=>editor.close();
document.querySelector('#asset-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)){status.textContent='PNG・JPEG・WebPの画像を選択してください。';return}if(file.size>15*1024*1024){status.textContent='画像は15MB以下にしてください。';return}const key=document.querySelector('#asset-select').value;const reader=new FileReader();reader.onload=()=>{editImages[key]=reader.result;status.textContent='画像を読み込みました。「反映」で確認できます。'};reader.readAsDataURL(file);e.target.value=''};
document.querySelector('#asset-clear').onclick=()=>{editImages[document.querySelector('#asset-select').value]='';status.textContent='画像を外しました。「反映」で確認できます。'};
function apply(){const previous=data;try{const next=JSON.parse(area.value);if(!Array.isArray(next.characters)||!next.characters.length||!Array.isArray(next.worlds)||!next.worlds.length||!Array.isArray(next.product)||!Array.isArray(next.story)||!Array.isArray(next.news)||!next.special||!next.system||typeof next.title!=='string'||typeof next.english!=='string')throw Error('必須項目を確認してください');data={...next,images:editImages};render();document.querySelector('#site-data').textContent=JSON.stringify(data,null,2).replace(/</g,'\\u003c');status.textContent='反映しました。変更を残すには「HTMLを保存」を押してください。';return true}catch(err){data=previous;render();status.textContent='反映できません：'+err.message;return false}}
document.querySelector('#apply').onclick=apply;document.querySelector('#download').onclick=()=>{if(!apply())return;const clone=document.documentElement.cloneNode(true);clone.querySelector('#editor').removeAttribute('open');clone.querySelector('#bonus-viewer').removeAttribute('open');clone.querySelector('#bonus-viewer img').removeAttribute('src');clone.querySelector('#data-editor').textContent='';clone.querySelector('#edit-status').textContent='';clone.querySelector('main').innerHTML='';const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ash-and-sand-railroad-stage4-top-video.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='変更を含むHTMLを保存しました。'};
</script></body></html>
